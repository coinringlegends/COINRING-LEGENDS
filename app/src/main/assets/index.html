<!-- 🔑 DYNAMISCHER BASE & ADAPTIVER ROUTER BASENAME 🔑 -->
<script>
(function() {
  try {
    var p = window.location.pathname;
    var baseEl = document.querySelector('base');
    if (window.location.protocol === 'file:') {
      if (baseEl) baseEl.href = './';
      window.__ROUTER_BASENAME__ = '';
    } else if (p.toLowerCase().includes('coinring-legends')) {
      var match = p.match(/\/coinring-legends\/?/i);
      var b = match ? match[0] : '/COINRING-LEGENDS/';
      if (!b.endsWith('/')) b += '/';
      if (baseEl) baseEl.href = b;
      window.__ROUTER_BASENAME__ = b.slice(0, -1);
    } else {
      if (baseEl) baseEl.href = './';
      window.__ROUTER_BASENAME__ = '';
    }
  } catch(e) {}
})();
</script>

<!-- 🔑 DESIGN & DATA: BASE44 BACKEND PROXY INTERCEPTOR 🔑 -->
<script>
(function(){
  function redirectBase44Url(url) {
    if (typeof url !== 'string') return url;
    if (url.includes('base44.app') || url.includes('railway.app') || url.includes('googleapis.com')) return url;
    var idx = url.search(/\/(api|apps|entities)\b/);
    if (idx !== -1) {
      return 'https://coinring-legends.base44.app' + url.slice(idx);
    }
    if (url.startsWith('api/') || url.startsWith('apps/') || url.startsWith('entities/')) {
      return 'https://coinring-legends.base44.app/' + url;
    }
    return url;
  }

  var open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(m, url) {
    arguments[1] = redirectBase44Url(url);
    return open.apply(this, arguments);
  };

  if (window.fetch) {
    var origFetch = window.fetch;
    window.fetch = function(r, i) {
      if (typeof r === 'string') {
        r = redirectBase44Url(r);
      } else if (r && r.url) {
        try {
          var target = redirectBase44Url(r.url);
          if (target !== r.url) r = target;
        } catch(e) {}
      }
      return origFetch.call(this, r, i);
    };
  }
})();
</script>

<!-- Page Title Sync with Basename support -->
<script>
(function(){
  var titles = {
    "/login": "Login | COINRING LEGENDS™",
    "/register": "Register | COINRING LEGENDS™",
    "/": "COINRING LEGENDS™",
    "/shop": "Shop | COINRING LEGENDS™",
    "/archive": "Archive | COINRING LEGENDS™",
    "/faq": "Faq | COINRING LEGENDS™",
    "/privacy": "Privacy | COINRING LEGENDS™",
    "/terms": "Terms | COINRING LEGENDS™",
    "/studio": "Studio | COINRING LEGENDS™",
    "/personalize": "Personalize | COINRING LEGENDS™",
    "/about": "About | COINRING LEGENDS™",
    "/contact": "Contact | COINRING LEGENDS™",
    "/checkout": "Checkout | COINRING LEGENDS™",
    "/admin": "Admin | COINRING LEGENDS™"
  };
  var dashed = function(s){ return s.replace(/([a-z0-9])([A-Z])/g,"$1-$2"); };
  var decode = function(s){ try{ var d=decodeURIComponent(s); return d.indexOf("/")<0?d:s; }catch(e){ return s; } };
  var segments = function(p){ return p.split("/").filter(Boolean).map(decode); };
  var norm = function(p){
    var clean = p.replace(/^\/coinring-legends\/?/i, '');
    var parts = segments(clean).map(function(s){ return dashed(s).toLowerCase(); });
    return parts.length ? "/" + parts.join("/") : "/";
  };
  var lastPath = location.pathname, written = document.title, on = true;
  var sync = function(){
    if (!on || location.pathname === lastPath) return;
    lastPath = location.pathname;
    if (document.title !== written) { on = false; return; }
    var title = titles[norm(location.pathname)];
    if (title === undefined) return;
    document.title = title;
    written = document.title;
  };
  var wrap = function(fn){ return function(){ var r = fn.apply(this, arguments); try{ sync(); }catch(e){} return r; }; };
  history.pushState = wrap(history.pushState);
  history.replaceState = wrap(history.replaceState);
  window.addEventListener("popstate", sync);
})();
</script>
