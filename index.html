<script>
function getRailwayUrl(){return (window.APP_CONFIG&&window.APP_CONFIG.RAILWAY_URL)?window.APP_CONFIG.RAILWAY_URL:'https://coinring-legends-production.up.railway.app';}
function getBase44Url(){return (window.APP_CONFIG&&window.APP_CONFIG.BASE44_DESIGN_URL)?window.APP_CONFIG.BASE44_DESIGN_URL:'https://coinring-legends.base44.app';}
</script>

<script>
(function () {
var proto = XMLHttpRequest.prototype;
var open = proto.open;
proto.open = function (method, url) {
  // 🔑 RICHTIG TRENNEN!
  if (typeof url === 'string') {
    // BACKEND -> RAILWAY (nur /api)
    if (url.startsWith('/api') &&!url.includes('railway.app') &&!url.includes('base44.app')) {
      arguments[1] = getRailwayUrl() + url;
      console.log('BACKEND -> RAILWAY:', url);
    }
    // DESIGN -> BASE44 ( /apps und /entities )
    else if ((url.startsWith('/apps') || url.startsWith('/entities')) &&!url.includes('base44.app') &&!url.includes('railway.app')) {
      if (!location.hostname.includes('base44.app')) {
        arguments[1] = getBase44Url() + url;
        console.log('DESIGN -> BASE44:', url);
      }
    }
  }
  return open.apply(this, arguments);
};
if (typeof window.fetch === 'function') {
  var origFetch = window.fetch;
  window.fetch = function (resource, init) {
    if (typeof resource === 'string') {
      if (resource.startsWith('/api') &&!resource.includes('railway.app') &&!resource.includes('base44.app')) {
        resource = getRailwayUrl() + resource;
      } else if ((resource.startsWith('/apps') || resource.startsWith('/entities')) &&!resource.includes('base44.app') &&!resource.includes('railway.app')) {
        if (!location.hostname.includes('base44.app')) {
          resource = getBase44Url() + resource;
        }
      }
    }
    return origFetch.call(this, resource, init);
  };
}
})();
</script>

<script>
(function () {
var titles = {"/login":"Login | COINRING LEGENDS™","/register":"Register | COINRING LEGENDS™","/":"COINRING LEGENDS™","/shop":"Shop | COINRING LEGENDS™","/archive":"Archive | COINRING LEGENDS™","/faq":"Faq | COINRING LEGENDS™","/privacy":"Privacy | COINRING LEGENDS™","/terms":"Terms | COINRING LEGENDS™","/studio":"Studio | COINRING LEGENDS™","/personalize":"Personalize | COINRING LEGENDS™","/about":"About | COINRING LEGENDS™","/contact":"Contact | COINRING LEGENDS™","/checkout":"Checkout | COINRING LEGENDS™","/admin":"Admin | COINRING LEGENDS™"};
var dashed = function (s) { return s.replace(/([a-z0-9])([A-Z])/g, "$1-$2"); };
var decode = function (s) { try { var d = decodeURIComponent(s); return d.indexOf("/") < 0? d : s; } catch (e) { return s; } };
var segments = function (path) { return path.split("/").filter(Boolean).map(decode); };
var norm = function (path) {
var parts = segments(path).map(function (s) { return dashed(s).toLowerCase(); });
return parts.length? "/" + parts.join("/") : "/";
};
var lastPath = location.pathname, written = document.title, on = true;
var sync = function () {
if (!on || location.pathname === lastPath) return;
lastPath = location.pathname;
if (document.title!== written) { on = false; return; }
var title = titles[norm(location.pathname)];
if (title === undefined) return;
document.title = title;
written = document.title;
};
var wrap = function (fn) {
return function () {
var r = fn.apply(this, arguments);
try { sync(); } catch (e) {}
return r;
};
};
history.pushState = wrap(history.pushState);
history.replaceState = wrap(history.replaceState);
window.addEventListener("popstate", sync);
})();
</script>
