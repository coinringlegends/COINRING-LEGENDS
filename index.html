<script>
// 🔑 Keys kommen NUR aus config.js - kein Fallback mit Keys im HTML!
function getRailwayUrl() {
  return (window.APP_CONFIG && window.APP_CONFIG.RAILWAY_URL) ? window.APP_CONFIG.RAILWAY_URL : 'https://coinring-legends-production.up.railway.app';
}
function getBase44Key() {
  return (window.APP_CONFIG && window.APP_CONFIG.BASE44_API_KEY) ? window.APP_CONFIG.BASE44_API_KEY : null;
}
function getGeminiKey() {
  return (window.APP_CONFIG && window.APP_CONFIG.GEMINI_API_KEY) ? window.APP_CONFIG.GEMINI_API_KEY : null;
}

if (!window.APP_CONFIG) {
  console.error('❌ config.js nicht geladen! Bitte ./config.js erstellen!');
} else {
  console.log('✅ config.js geladen - DESIGN=BASE44, BACKEND=RAILWAY');
}
</script>

<!-- 🔑 BACKEND = RAILWAY - KEINI KEYS HIER! 🔑 -->
<script>
(function () {
var proto = XMLHttpRequest.prototype;
var open = proto.open, setRequestHeader = proto.setRequestHeader, send = proto.send;
var TOKEN_KEY = 'base44_access_token';
var storedTokenHeader = function () {
  try { return 'Bearer ' + localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
};
var forgetStoredToken = function () {
  try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('token'); } catch (e) {}
};
proto.open = function (method, url) {
  this.__b44IsAuthCheck = /\/entities\/User\/me(\?|$)/.test(url);
  if (typeof url === 'string' && (url.startsWith('/api') || url.startsWith('/apps') || url.startsWith('/entities'))) {
    if (!url.includes('base44.app') && !url.includes('railway.app') && !location.hostname.includes('base44.app')) {
      var railway = getRailwayUrl();
      console.log('🔑 BACKEND -> RAILWAY:', url, '->', railway + url);
      arguments[1] = railway + url;
    }
  }
  return open.apply(this, arguments);
};
proto.setRequestHeader = function (name, value) {
  if (this.__b44IsAuthCheck && name.toLowerCase() === 'authorization' && value === storedTokenHeader()) {
    this.__b44SentToken = value;
  }
  return setRequestHeader.call(this, name, value);
};
proto.send = function () {
  this.addEventListener('loadend', function () {
    if (this.status === 401 && this.__b44SentToken === storedTokenHeader()) forgetStoredToken();
  });
  return send.apply(this, arguments);
};
if (typeof window.fetch === 'function') {
  var origFetch = window.fetch;
  window.fetch = function (resource, init) {
    if (typeof resource === 'string' && (resource.startsWith('/api') || resource.startsWith('/apps') || resource.startsWith('/entities')) && !resource.includes('base44.app') && !resource.includes('railway.app')) {
      resource = getRailwayUrl() + resource;
    }
    return origFetch.call(this, resource, init);
  };
}
})();
</script>

var dashed = function (s) { return s.replace(/([a-z0-9])([A-Z])/g, "$1-$2"); };
var decode = function (s) { try { var d = decodeURIComponent(s); return d.indexOf("/") < 0 ? d : s; } catch (e) { return s; } };
var segments = function (path) { return path.split("/").filter(Boolean).map(decode); };
var norm = function (path) {
var parts = segments(path).map(function (s) { return dashed(s).toLowerCase(); });
return parts.length ? "/" + parts.join("/") : "/";
};
var lastPath = location.pathname, written = document.title, on = true;
var sync = function () {
if (!on || location.pathname === lastPath) return;
lastPath = location.pathname;
if (document.title !== written) { on = false; return; }
var title = titles[norm(location.pathname)];
if (title === undefined) return;
document.title = title;
written = document.title;
};
var wrap = function (fn) {
return function () {
var r = fn.apply(this, arguments);
try { sync(); } catch (e) {}
return r;
};
};
history.pushState = wrap(history.pushState);
history.replaceState = wrap(history.replaceState);
window.addEventListener("popstate", sync);
})();
