<script>
window.APP_CONFIG = window.APP_CONFIG || {
  RAILWAY_URL: 'https://coinring-legends-production.up.railway.app',
  BASE44_DESIGN_URL: 'https://coinring-legends.base44.app'
};
// Versuche config.js zu laden, aber blockiere nicht wenn fehlt
(function(){
  var s = document.createElement('script');
  s.src = './config.js?v=' + Date.now();
  s.async = false;
  s.onerror = function(){ console.warn('config.js nicht gefunden - benutze Default URLs'); };
  s.onload = function(){ console.log('✅ config.js geladen'); };
  // Füge vor allen anderen Scripts ein
  var first = document.getElementsByTagName('script')[0];
  if(first && first.parentNode) first.parentNode.insertBefore(s, first);
  else document.head.appendChild(s);
})();
function getRailwayUrl(){return (window.APP_CONFIG&&window.APP_CONFIG.RAILWAY_URL)||'https://coinring-legends-production.up.railway.app';}
function getBase44Url(){return (window.APP_CONFIG&&window.APP_CONFIG.BASE44_DESIGN_URL)||'https://coinring-legends.base44.app';}
</script>

<script>
(function () {
var proto = XMLHttpRequest.prototype;
var open = proto.open;
proto.open = function (method, url) {
  if (typeof url === 'string') {
    if (url.startsWith('/api') &&!url.includes('railway.app') &&!url.includes('base44.app')) {
      try { arguments[1] = getRailwayUrl() + url; } catch(e){}
    } else if ((url.startsWith('/apps') || url.startsWith('/entities')) &&!url.includes('base44.app') &&!url.includes('railway.app')) {
      try { if(!location.hostname.includes('base44.app')) arguments[1] = getBase44Url() + url; } catch(e){}
    }
  }
  return open.apply(this, arguments);
};
if (typeof window.fetch === 'function') {
  var origFetch = window.fetch;
  window.fetch = function (resource, init) {
    try {
      if (typeof resource === 'string') {
        if (resource.startsWith('/api') &&!resource.includes('railway.app') &&!resource.includes('base44.app')) {
          resource = getRailwayUrl() + resource;
        } else if ((resource.startsWith('/apps') || resource.startsWith('/entities')) &&!resource.includes('base44.app') &&!resource.includes('railway.app')) {
          if(!location.hostname.includes('base44.app')) resource = getBase44Url() + resource;
        }
      }
    } catch(e){}
    return origFetch.call(this, resource, init);
  };
}
})();
</script>
