<script>
(function(){
var open=XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open=function(m,url){
  if(typeof url==='string'){
    // Alles von Base44 holen für Design
    if((url.startsWith('/api')||url.startsWith('/apps')||url.startsWith('/entities'))&&!url.includes('railway.app')&&!url.includes('base44.app')&&!location.hostname.includes('base44.app')){
      arguments[1]='https://coinring-legends.base44.app'+url;
    }
  }
  return open.apply(this,arguments);
};
if(window.fetch){
  var origFetch=window.fetch;
  window.fetch=function(r,i){
    if(typeof r==='string'&&(r.startsWith('/api')||r.startsWith('/apps')||r.startsWith('/entities'))&&!r.includes('railway.app')&&!r.includes('base44.app')&&!location.hostname.includes('base44.app')){
      r='https://coinring-legends.base44.app'+r;
    }
    return origFetch.call(this,r,i);
  };
}
})();
</script>

<script>
(function(){
var titles={"/login":"Login | COINRING LEGENDS™","/register":"Register | COINRING LEGENDS™","/":"COINRING LEGENDS™","/shop":"Shop | COINRING LEGENDS™","/archive":"Archive | COINRING LEGENDS™","/faq":"Faq | COINRING LEGENDS™","/privacy":"Privacy | COINRING LEGENDS™","/terms":"Terms | COINRING LEGENDS™","/studio":"Studio | COINRING LEGENDS™","/personalize":"Personalize | COINRING LEGENDS™","/about":"About | COINRING LEGENDS™","/contact":"Contact | COINRING LEGENDS™","/checkout":"Checkout | COINRING LEGENDS™","/admin":"Admin | COINRING LEGENDS™"};
var dashed=function(s){return s.replace(/([a-z0-9])([A-Z])/g,"$1-$2");};
var decode=function(s){try{var d=decodeURIComponent(s);return d.indexOf("/")<0?d:s;}catch(e){return s;}};
var segments=function(p){return p.split("/").filter(Boolean).map(decode);};
var norm=function(p){var parts=segments(p).map(function(s){return dashed(s).toLowerCase();});return parts.length?"/"+parts.join("/"):"/";};
var lastPath=location.pathname,written=document.title,on=true;
var sync=function(){
if(!on||location.pathname===lastPath)return;
lastPath=location.pathname;
if(document.title!==written){on=false;return;}
var title=titles[norm(location.pathname)];
if(title===undefined)return;
document.title=title;
written=document.title;
};
var wrap=function(fn){return function(){var r=fn.apply(this,arguments);try{sync();}catch(e){}return r;};};
history.pushState=wrap(history.pushState);
history.replaceState=wrap(history.replaceState);
window.addEventListener("popstate",sync);
})();
</script>
