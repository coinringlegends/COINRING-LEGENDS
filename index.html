  <script>
    (function () {
      var proto = XMLHttpRequest.prototype;
      var open = proto.open, setRequestHeader = proto.setRequestHeader, send = proto.send;
      var TOKEN_KEY = 'base44_access_token';
      var storedTokenHeader = function () { try { return 'Bearer ' + localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } };
      var forgetStoredToken = function () { try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('token'); } catch (e) {} };
      proto.open = function (method, url) {
        this.__b44IsAuthCheck = /\/entities\/User\/me(\?|$)/.test(url);
        if (typeof url === 'string' && (url.startsWith('/api') || url.startsWith('/apps') || url.startsWith('/entities')) && !location.hostname.includes('railway.app')) {
          url = 'https://coinring-legends-production.up.railway.app' + url;
        }
        return open.apply(this, arguments);
      };
      proto.setRequestHeader = function (name, value) {
        if (this.__b44IsAuthCheck && name.toLowerCase() === 'authorization' && value === storedTokenHeader()) { this.__b44SentToken = value; }
        return setRequestHeader.call(this, name, value);
      };
      proto.send = function () {
        this.addEventListener('loadend', function () {
          var rejectedTokenStillStored = this.status === 401 && this.__b44SentToken === storedTokenHeader();
          if (rejectedTokenStillStored) forgetStoredToken();
        });
        return send.apply(this, arguments);
      };
      if (typeof window.fetch === 'function') {
        var origFetch = window.fetch;
        window.fetch = function (resource, init) {
          try {
            if (typeof resource === 'string' && (resource.startsWith('/api') || resource.startsWith('/apps') || resource.startsWith('/entities')) && !location.hostname.includes('railway.app')) {
              resource = 'https://coinring-legends-production.up.railway.app' + resource;
            }
          } catch(e) {}
          return origFetch.call(this, resource, init);
        };
      }
    })();
  </script>

  <script>
    var isChatOpen=false; var clientId='client_'+(localStorage.getItem('coinring_client_id')||Math.random().toString(36).substring(2,9)); localStorage.setItem('coinring_client_id',clientId);
    function toggleCoinringChat(){ isChatOpen=!isChatOpen; var box=document.getElementById('coinring-chat-box'); if(box){ box.style.display=isChatOpen?'flex':'none'; } }
    function sendQuickPrompt(text){ document.getElementById('cr-input').value=text; sendUserMessage(); }
    async function sendUserMessage(){
      var inp=document.getElementById('cr-input'); if(!inp) return; var msg=inp.value.trim(); if(!msg) return; inp.value='';
      var msgs=document.getElementById('cr-messages'); var typing=document.getElementById('cr-typing');
      var userDiv=document.createElement('div'); userDiv.className='cr-msg cr-msg-user'; userDiv.textContent=msg; msgs.insertBefore(userDiv,typing);
      if(typing) typing.style.display='block';
      try{
        var res=await fetch('https://coinring-legends-production.up.railway.app/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,customerId:clientId})});
        var replyText='Danke! Für direkt Kontakt: WhatsApp 079 833 93 87';
        if(res && res.ok){ var data=await res.json(); replyText=data.reply||data.message||replyText; }
        if(typing) typing.style.display='none';
        var botDiv=document.createElement('div'); botDiv.className='cr-msg cr-msg-bot'; botDiv.innerHTML=replyText; msgs.insertBefore(botDiv,typing);
      }catch(err){ if(typing) typing.style.display='none'; var botDiv=document.createElement('div'); botDiv.className='cr-msg cr-msg-bot'; botDiv.innerHTML='Grüezi! TWINT: 076 322 79 81 · WhatsApp: 079 833 93 87'; msgs.insertBefore(botDiv,typing); }
    }
  </script>
